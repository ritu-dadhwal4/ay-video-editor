<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AY render</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800;900&family=Montserrat:wght@500;700;800&family=DM+Sans:wght@500;700;800&family=Poppins:wght@500;700;800&family=Syne:wght@500;700;800&family=Jost:wght@500;700&family=Anton&family=Archivo+Black&family=Caveat:wght@500;700&family=Permanent+Marker&family=Space+Mono:wght@400;700&family=Instrument+Serif:ital@0;1&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Bodoni+Moda:ital@0;1&family=DM+Serif+Display:ital@0;1&family=Fraunces:ital@0;1&family=EB+Garamond:ital@0;1&display=block">
<style>
  html, body { margin: 0; background: #000; }
  #stage { width: 1080px; height: 1920px; }
  .ayr-stage { position: relative; overflow: hidden; background: #000; container-type: size; isolation: isolate; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="styles.js"></script>
<script src="render.js"></script>
<script>
/* The render page: the same renderer as the editor preview, fed one frame
   of the cut at a time by scripts/render.mjs, so the MP4 matches what the
   creator saw. */
let s
window.setup = async (project, state) => {
  s = AYR.mount(document.getElementById('stage'), state, { media: 'frames', project, single: false })
  await document.fonts.ready
  return { events: s.events, needsCutout: s.needsCutout }
}
const load = (img, src) => new Promise((res) => {
  if (!src) { img.removeAttribute('src'); return res() }
  img.onload = img.onerror = () => res()
  img.src = src
})
window.frame = async (t, src, cutSrc) => {
  await Promise.all([load(s.media, src), load(s.cut, cutSrc)])
  s.cut.style.visibility = cutSrc ? 'visible' : 'hidden'
  s.at(t)
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
}
window.READY = true
</script>
</body>
</html>
