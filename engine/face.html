<!doctype html>
<meta charset="utf-8">
<title>AY face finder</title>
<script type="module">
// Runs MediaPipe's short-range face detector (made for phone-distance faces)
// on frames the script hands it. Everything stays on this computer.
import { FilesetResolver, FaceDetector } from '../node_modules/@mediapipe/tasks-vision/vision_bundle.mjs'
const files = await FilesetResolver.forVisionTasks('../node_modules/@mediapipe/tasks-vision/wasm')
const det = await FaceDetector.createFromOptions(files, {
  baseOptions: { modelAssetPath: '../models/blaze_face_short_range.tflite', delegate: 'CPU' },
  runningMode: 'IMAGE', minDetectionConfidence: 0.5,
})
window.detect = async (src) => {
  const img = new Image()
  img.src = src
  await img.decode()
  const r = det.detect(img).detections
  if (!r.length) return null
  const d = r.sort((a, b) => b.boundingBox.width - a.boundingBox.width)[0]
  const b = d.boundingBox, k = d.keypoints
  return { x: b.originX / img.width, y: b.originY / img.height, w: b.width / img.width, h: b.height / img.height, eyes: (k[0].y + k[1].y) / 2 }
}
window.READY = true
</script>
